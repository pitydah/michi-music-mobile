name: Signal Truth + UI5 Integration

on:
  push:
    branches: [feat/signal-truth-mobile-r12-on-ui5]
  pull_request:
    branches: [feat/ui5-consolidated]

jobs:
  android-integration:
    name: Signal Truth Android and APK gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify UI5 + Signal Truth with Android Gradle
        run: bash scripts/verify_signal_truth_ui5.sh
