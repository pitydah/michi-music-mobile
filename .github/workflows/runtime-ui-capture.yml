name: Runtime UI Capture

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-runtime-ui:
    name: Capture real Android UI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant script permissions
        run: chmod +x gradlew .github/scripts/capture-runtime-ui.sh

      - name: Build, launch and capture actual application
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/capture-runtime-ui.sh

      - name: Upload runtime screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: michi-mobile-runtime-ui
          path: runtime-screenshots/
          if-no-files-found: warn
          retention-days: 7
