name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Job A — Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Lint
        run: ./gradlew lint

  unit-tests-normal:
    name: "Job B — Unit Tests (Normal)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Core & Normal Unit Tests and Verify Android Instrumented Tests
        run: ./gradlew :core:testDebugUnitTest :data:testDebugUnitTest :player:testDebugUnitTest :michi-link-client:testDebugUnitTest :app:testNormalDebugUnitTest :app:compileNormalDebugAndroidTestKotlin :app:assembleNormalDebugAndroidTest

  unit-tests-fdroid:
    name: "Job C — Unit Tests (F-Droid)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run F-Droid Unit Tests and Verify Android Instrumented Tests
        run: ./gradlew :app:testFdroidDebugUnitTest :app:compileFdroidDebugAndroidTestKotlin

  migrations-and-schema:
    name: "Job D — Room Migrations & Schemas"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Verify Room Migrations and Schemas
        run: ./gradlew :data:testDebugUnitTest --tests "org.michimusic.data.cache.Migration3To4Test"

  build-normal:
    name: "Job E — Build Normal"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Assemble Normal Debug & Release
        run: ./gradlew assembleNormalDebug assembleNormalRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk-normal-debug
          path: app/build/outputs/apk/normal/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-normal-release
          path: app/build/outputs/apk/normal/release/*.apk

  build-fdroid:
    name: "Job F — Build F-Droid"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Assemble F-Droid Debug
        run: ./gradlew assembleFdroidDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk

  instrumented-tests:
    name: "Job G — Instrumented Tests (Normal, API 36)"
    runs-on: ubuntu-latest
    # Compiling androidTest is not the same as running it: the Aero quality gate
    # assertions (semantics, touch targets, the remote queue dialog) only fail on a
    # real Android runtime. This job boots an emulator and runs them for real.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # The hosted runner exposes /dev/kvm but only to the kvm group. Granting it
      # explicitly keeps the emulator hardware accelerated instead of falling back
      # to software rendering, which times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedNormalDebugAndroidTest --stacktrace
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          retention-days: 7

  quality-gate:
    name: "Quality Gate — Release Candidate Stability"
    runs-on: ubuntu-latest
    needs: [lint, unit-tests-normal, unit-tests-fdroid, migrations-and-schema, build-normal, build-fdroid, instrumented-tests]
    steps:
      - name: Check All Jobs Succeeded
        run: echo "Quality Gate Passed! All checks (Lint, Unit Tests Normal & FDroid, Room Migrations, Debug & Release Builds) are green."

