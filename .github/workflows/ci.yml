name: CI

on:
  workflow_dispatch:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Job A — Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Lint
        run: ./gradlew lint
      - name: Check modular Settings architecture
        run: python3 tools/check_settings_architecture.py

  unit-tests-normal:
    name: "Job B — Unit Tests (Normal)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Build Logic Tests
        run: ./gradlew -p buildSrc test
      - name: Run Core & Normal Unit Tests and Verify Android Instrumented Tests
        # aircat-transfer is listed explicitly: it is a real module with its own
        # grants, integrity, journal and recovery suites, and nothing else in this
        # workflow compiles its tests. Leaving it out made those failures invisible.
        run: ./gradlew :core:testDebugUnitTest :data:testDebugUnitTest :player:testDebugUnitTest :michi-link-client:testDebugUnitTest :aircat-transfer:testDebugUnitTest :app:testNormalDebugUnitTest :app:compileNormalDebugAndroidTestKotlin :app:assembleNormalDebugAndroidTest

  unit-tests-fdroid:
    name: "Job C — Unit Tests (F-Droid)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run F-Droid Unit Tests and Verify Android Instrumented Tests
        run: ./gradlew :app:testFdroidDebugUnitTest :app:compileFdroidDebugAndroidTestKotlin

  migrations-and-schema:
    name: "Job D — Room Migrations & Schemas"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Verify Room Migrations and Schemas
        run: ./gradlew :data:testDebugUnitTest --tests "org.michimusic.data.cache.Migration3To4Test" --tests "org.michimusic.data.cache.Migration10To11Test" --tests "org.michimusic.data.cache.Migration11To12Test"

  build-normal:
    name: "Job E — Build Normal"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Assemble Normal Debug
        run: ./gradlew assembleNormalDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-normal-debug
          path: app/build/outputs/apk/normal/debug/*.apk
      # The release APK is deliberately not built and not uploaded here. A
      # distributable artifact only exists when the artwork is approved, and the
      # release gate below is what proves that.

  release-gate:
    name: "Job H — UI7 Release Gate"
    runs-on: ubuntu-latest
    # Development quality and release authorisation are different questions. This
    # job asks the second one: it builds the distributable variant, whose packaging
    # tasks depend on the UI7 certification gates, and then classifies the result.
    # ARTISTIC_APPROVAL_PENDING keeps the development CI green and release closed;
    # anything else that fails is a real regression and stays red.
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # The exit code is captured, never swallowed: the next step decides what it
      # means, and there is no `continue-on-error` anywhere in this job.
      - name: Assemble the release variant and capture the outcome
        id: build
        run: |
          set +e
          ./gradlew assembleNormalRelease 2>&1 | tee release-build.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Classify the release outcome
        id: classify
        run: |
          python3 tools/classify_ui7_release_gate.py \
            --log release-build.log \
            --exit-code "${{ steps.build.outputs.exit_code }}" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"
      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui7-release-gate
          path: release-build.log
          retention-days: 7

  build-fdroid:
    name: "Job F — Build F-Droid"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Assemble F-Droid Debug
        run: ./gradlew assembleFdroidDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk

  instrumented-tests:
    name: "Job G — Instrumented Tests (Normal, API 36)"
    runs-on: ubuntu-latest
    # Compiling androidTest is not the same as running it: the Aero quality gate
    # assertions (semantics, touch targets, the remote queue dialog) only fail on a
    # real Android runtime. This job boots an emulator and runs them for real.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # The hosted runner exposes /dev/kvm but only to the kvm group. Granting it
      # explicitly keeps the emulator hardware accelerated instead of falling back
      # to software rendering, which times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedNormalDebugAndroidTest --stacktrace
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          retention-days: 7

  quality-gate:
    name: "Quality Gate — Release Candidate Stability"
    runs-on: ubuntu-latest
    # Runs even when a dependency failed, so the gate can say which one and never
    # reports a missing job as a pass.
    if: always()
    needs: [lint, unit-tests-normal, unit-tests-fdroid, migrations-and-schema, build-normal, build-fdroid, instrumented-tests, release-gate]
    steps:
      - name: Report every gate
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          | Job | Result |
          |---|---|
          | Lint (A) | ${{ needs.lint.result }} |
          | Unit Tests Normal (B) | ${{ needs.unit-tests-normal.result }} |
          | Unit Tests F-Droid (C) | ${{ needs.unit-tests-fdroid.result }} |
          | Room Migrations (D) | ${{ needs.migrations-and-schema.result }} |
          | Build Normal debug (E) | ${{ needs.build-normal.result }} |
          | Build F-Droid debug (F) | ${{ needs.build-fdroid.result }} |
          | Instrumented Tests API 36 (G) | ${{ needs.instrumented-tests.result }} |
          | UI7 Release Gate (H) | ${{ needs.release-gate.result }} — ${{ needs.release-gate.outputs.classification }} |
          EOF
      - name: Fail on any real failure
        run: |
          failed=""
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.unit-tests-normal.result }}" \
            "${{ needs.unit-tests-fdroid.result }}" \
            "${{ needs.migrations-and-schema.result }}" \
            "${{ needs.build-normal.result }}" \
            "${{ needs.build-fdroid.result }}" \
            "${{ needs.instrumented-tests.result }}" \
            "${{ needs.release-gate.result }}"; do
            if [ "$result" != "success" ]; then failed="$failed $result"; fi
          done
          if [ -n "$failed" ]; then
            echo "a required job did not succeed:$failed"
            exit 1
          fi
          echo "TECHNICAL_INTEGRATION_GO"
      # A green run means the code is sound. It does not mean the catalogue may be
      # distributed, and this is the line that says so out loud. Only the two states
      # the classifier is allowed to emit are accepted here: anything else — an empty
      # output, a missing job, an unrecognised word, a regression verdict dressed as a
      # success — fails the gate instead of being published as "waiting for review".
      - name: Publish the release posture
        run: |
          classification="${{ needs.release-gate.outputs.classification }}"
          result="${{ needs.release-gate.result }}"
          case "$classification" in
            RELEASE_CERTIFIED_GO|ARTISTIC_APPROVAL_PENDING) ;;
            *)
              echo "unrecognised release classification: '${classification}' (job result: ${result})"
              exit 1
              ;;
          esac
          if [ "$result" != "success" ]; then
            echo "release gate job finished as '${result}' but reported '${classification}'"
            exit 1
          fi
          if [ "$classification" = "RELEASE_CERTIFIED_GO" ]; then
            echo "RELEASE_CERTIFIED_GO"
            echo "RELEASE_CERTIFIED_GO" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ARTISTIC_APPROVAL_PENDING"
            echo "RELEASE_NO_GO"
            {
              echo ""
              echo "ARTISTIC_APPROVAL_PENDING"
              echo "RELEASE_NO_GO"
              echo ""
              echo "Some packaged artwork still awaits visual review."
              echo "No release APK or AAB is produced or uploaded while that holds."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
