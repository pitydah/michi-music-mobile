name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Job A — Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Lint
        run: ./gradlew lint

  unit-tests-normal:
    name: "Job B — Unit Tests (Normal)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run Core & Normal Unit Tests
        run: ./gradlew :core:testDebugUnitTest :data:testDebugUnitTest :player:testDebugUnitTest :michi-link-client:testDebugUnitTest :app:testNormalDebugUnitTest

  unit-tests-fdroid:
    name: "Job C — Unit Tests (F-Droid)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run F-Droid Unit Tests
        run: ./gradlew :app:testFdroidDebugUnitTest

  migrations-and-schema:
    name: "Job D — Room Migrations & Schemas"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Verify Room Migrations and Schemas
        run: ./gradlew :data:testDebugUnitTest --tests "org.michimusic.data.cache.Migration3To4Test"

  build-normal:
    name: "Job E — Build Normal"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Assemble Normal Debug & Release
        run: ./gradlew assembleNormalDebug assembleNormalRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk-normal-debug
          path: app/build/outputs/apk/normal/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-normal-release
          path: app/build/outputs/apk/normal/release/*.apk

  build-fdroid:
    name: "Job F — Build F-Droid"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Assemble F-Droid Debug
        run: ./gradlew assembleFdroidDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-fdroid-debug
          path: app/build/outputs/apk/fdroid/debug/*.apk

  quality-gate:
    name: "Quality Gate — Release Candidate Stability"
    runs-on: ubuntu-latest
    needs: [lint, unit-tests-normal, unit-tests-fdroid, migrations-and-schema, build-normal, build-fdroid]
    steps:
      - name: Check All Jobs Succeeded
        run: echo "Quality Gate Passed! All checks (Lint, Unit Tests Normal & FDroid, Room Migrations, Debug & Release Builds) are green."

